name: AUR upload (bin)

# Thin dispatcher: rust-app-release dispatches here with version_name,
# we delegate to the shared reusable (desktop entry + icon included).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 0.3.1)"
        required: true

jobs:
  aur-upload:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@v1
    with:
      pkgname: renedown-bin
      pkgdesc: "Cross-platform Markdown viewer/editor built with Repose"
      binary-name: renedown-${{ inputs.version_name }}-x86_64-unknown-linux-gnu.tar.gz
      binary-name-aarch64: renedown-${{ inputs.version_name }}-aarch64-unknown-linux-gnu.tar.gz
      app-name: "Renedown"
      license: "LGPL-2.1-or-later"
      provides: "renedown"
      conflicts: "renedown"
      desktop-file-path: "others/flathub/io.github.mlm_games.renedown.desktop"
      icon-url: "https://raw.githubusercontent.com/mlm-games/renedown/main/others/packaging/icon.svg"
      version: ${{ inputs.version_name }}
      maintainer-name: "MLM Games"
      maintainer-email: "dev@mlm.games"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
